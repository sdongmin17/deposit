<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예적금 세후 이자 계산기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding: 20px 10px; }
    .container { max-width: 480px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; }
    .input-box { display: flex; align-items: center; border: 1px solid #ccc; border-radius: 6px; padding: 8px 12px; }
    .input-box input, .input-box select { width: 100%; border: none; outline: none; font-size: 1rem; background: transparent; }
    .unit { font-size: 0.9rem; color: #666; margin-left: 5px; white-space: nowrap; }
    
    .type-btns { display: flex; gap: 8px; margin-bottom: 15px; }
    .type-btn { flex: 1; padding: 10px; border: 1px solid #ccc; background: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .type-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    
    .calc-btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    
    .result-box { display: none; margin-top: 20px; padding: 15px; background: #f0f7ff; border-radius: 8px; border: 1px solid #cce3ff; }
    .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
    .result-row:last-child { margin-bottom: 0; }
    .highlight { font-weight: bold; color: #2563eb; }
  </style>
</head>
<body>

  <div class="container">
    <h1>예적금 세후 이자 계산기</h1>

    <!-- 상품 선택 (예금 / 적금) -->
    <div class="type-btns">
      <button class="type-btn active" id="btn-deposit" onclick="setProduct('deposit')">정기예금</button>
      <button class="type-btn" id="btn-saving" onclick="setProduct('saving')">정기적금</button>
    </div>

    <!-- 납입 금액 -->
    <div class="form-group">
      <label id="label-amount">예치 금액 (원금)</label>
      <div class="input-box">
        <input type="number" id="amount" placeholder="예: 1000" step="any">
        <span class="unit">만원</span>
      </div>
    </div>

    <!-- 약정 금리 -->
    <div class="form-group">
      <label>연이율 (금리)</label>
      <div class="input-box">
        <input type="number" id="rate" placeholder="예: 3.5" step="0.01">
        <span class="unit">%</span>
      </div>
    </div>

    <!-- 저축 기간 -->
    <div class="form-group">
      <label>저축 기간</label>
      <div class="input-box">
        <input type="number" id="months" placeholder="예: 12" value="12">
        <span class="unit">개월</span>
      </div>
    </div>

    <!-- 과세 구분 -->
    <div class="form-group">
      <label>과세 구분</label>
      <div class="input-box">
        <select id="tax-type">
          <option value="15.4">일반과세 (15.4%)</option>
          <option value="9.5">세금우대 (9.5%)</option>
          <option value="0">비과세 (0%)</option>
        </select>
      </div>
    </div>

    <button class="calc-btn" onclick="calculate()">계산하기</button>

    <!-- 결과 화면 -->
    <div class="result-box" id="result">
      <div class="result-row">
        <span>총 저축 원금</span>
        <span id="val-principal">0 원</span>
      </div>
      <div class="result-row">
        <span>세전 이자</span>
        <span id="val-before-tax">0 원</span>
      </div>
      <div class="result-row">
        <span>이자 과세 (세금)</span>
        <span id="val-tax">0 원</span>
      </div>
      <div class="result-row">
        <span>세후 이자</span>
        <span id="val-after-tax">0 원</span>
      </div>
      <div class="result-row">
        <span>최종 만기 수령액</span>
        <span class="highlight" id="val-total">0 원</span>
      </div>
    </div>
  </div>

  <script>
    let product = 'deposit'; // 기본값: 예금

    function setProduct(type) {
      if (product === type) return; // 이미 선택된 탭이면 동작 안함

      const amountInput = document.getElementById('amount');
      const monthsVal = parseInt(document.getElementById('months').value) || 12;
      const currentVal = parseFloat(amountInput.value);

      // 금액 자동 환산 로직 (예금 -> 적금: ÷개월수 / 적금 -> 예금: ×개월수)
      if (currentVal && !isNaN(currentVal)) {
        if (type === 'saving') {
          // 예금에서 적금으로 전환 시: 총 예치금을 개월 수로 나눔
          const monthly = currentVal / monthsVal;
          amountInput.value = Number(monthly.toFixed(2)); // 소수점 둘째자리까지 정리
        } else {
          // 적금에서 예금으로 전환 시: 월 적립액을 개월 수만큼 곱함
          const total = currentVal * monthsVal;
          amountInput.value = Number(total.toFixed(2));
        }
      }

      product = type;
      document.getElementById('btn-deposit').classList.toggle('active', type === 'deposit');
      document.getElementById('btn-saving').classList.toggle('active', type === 'saving');
      
      const labelAmount = document.getElementById('label-amount');
      
      if (type === 'deposit') {
        labelAmount.innerText = '예치 금액 (원금)';
        amountInput.placeholder = '예: 1000';
      } else {
        labelAmount.innerText = '월 적립액';
        amountInput.placeholder = '예: 83.33';
      }

      // 이미 결과창이 떠있었다면 전환된 값으로 바로 다시 계산
      if (document.getElementById('result').style.display === 'block') {
        calculate();
      }
    }

    function calculate() {
      const amountVal = parseFloat(document.getElementById('amount').value);
      const rateVal = parseFloat(document.getElementById('rate').value);
      const monthsVal = parseInt(document.getElementById('months').value);
      const taxRate = parseFloat(document.getElementById('tax-type').value);

      if (!amountVal || !rateVal || !monthsVal) {
        alert('모든 입력값을 올바르게 채워주세요.');
        return;
      }

      let principal = 0;
      let beforeTaxInterest = 0;

      if (product === 'deposit') {
        // 정기예금: 원금 * 연이율 * (개월수 / 12)
        principal = amountVal * 10000;
        beforeTaxInterest = principal * (rateVal / 100) * (monthsVal / 12);
      } else {
        // 정기적금: 월적립액 * 개월수, 이자는 단리 단기적용 공식
        const monthlyAmount = amountVal * 10000;
        principal = monthlyAmount * monthsVal;
        beforeTaxInterest = monthlyAmount * (monthsVal * (monthsVal + 1) / 2) * (rateVal / 100 / 12);
      }

      principal = Math.round(principal);
      beforeTaxInterest = Math.round(beforeTaxInterest);
      const tax = Math.round(beforeTaxInterest * (taxRate / 100));
      const afterTaxInterest = beforeTaxInterest - tax;
      const totalSum = principal + afterTaxInterest;

      document.getElementById('val-principal').innerText = principal.toLocaleString() + ' 원';
      document.getElementById('val-before-tax').innerText = beforeTaxInterest.toLocaleString() + ' 원';
      document.getElementById('val-tax').innerText = tax.toLocaleString() + ' 원';
      document.getElementById('val-after-tax').innerText = afterTaxInterest.toLocaleString() + ' 원';
      document.getElementById('val-total').innerText = totalSum.toLocaleString() + ' 원';
      document.getElementById('result').style.display = 'block';
    }
  </script>
</body>
</html>
